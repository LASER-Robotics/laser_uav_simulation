name: simulation
root: ./
startup_window: tui
pre_window: export UAV_NAME=uav1; export UAV_TYPE=x500
windows:
  - spawn:
      layout: even-horizontal
      panes:
        - ros2 launch laser_uav_simulation gazebo.launch.py
        # - ros2 launch laser_uav_simulation gazebo.launch.py real_time:=0.75
        - sleep 4; ../../scripts/./spawn_payload.sh 0.0 0.0 0.1 --enable_ground_truth
        - ros2 launch laser_uav_simulation spawn_drones.launch.py spawn_drones_file:=./configs/spawn.yaml
  - api:
      layout: even-horizontal
      panes:
        - sleep 1; ros2 launch laser_uav_px4_api api.launch.py 
        - sleep 1; ros2 run laser_uav_simulation autostart.py 
        - export UAV_NAME=uav2; sleep 3; ros2 launch laser_uav_px4_api api.launch.py
        - export UAV_NAME=uav2; sleep 3; ros2 run laser_uav_simulation autostart.py
        # - export UAV_NAME=uav3; sleep 6; ros2 launch laser_uav_px4_api api.launch.py
        # - export UAV_NAME=uav3; sleep 6; ros2 run laser_uav_simulation autostart.py
        # - export UAV_NAME=uav4; sleep 8; ros2 launch laser_uav_px4_api api.launch.py
        # - export UAV_NAME=uav4; sleep 8; ros2 run laser_uav_simulation autostart.py
  - estimation_manager:
      layout: tiled
      panes:
          - sleep 1; ros2 launch laser_uav_managers estimation_manager.launch.py
          - export UAV_NAME=uav2; sleep 3; ros2 launch laser_uav_managers estimation_manager.launch.py
          - sleep 6; ros2 topic echo /payload/ground_truth --no-arr
          # - export UAV_NAME=uav3; sleep 6; ros2 launch laser_uav_managers estimation_manager.launch.py
          # - export UAV_NAME=uav4; sleep 8; ros2 launch laser_uav_managers estimation_manager.launch.py
  - tui:
      layout: even-horizontal
      panes:
        - sleep 1; ros2 run laser_uav_tui tui --config ./configs/topics.yaml
  - neighbor_odom:
      layout: tiled
      panes:
        # - sleep 1; ros2 launch multi_drone_state multi_drone_state.launch.py
        # - export UAV_NAME=uav2; sleep 3; ros2 launch multi_drone_state multi_drone_state.launch.py
        # - export UAV_NAME=uav3; sleep 6; ros2 launch multi_drone_state multi_drone_state.launch.py
        # - export UAV_NAME=uav4; sleep 8; ros2 launch multi_drone_state multi_drone_state.launch.py
  - control_manager:
      layout: tiled
      panes:
        - sleep 1; ros2 launch laser_uav_managers control_manager.launch.py
        - export UAV_NAME=uav2; sleep 3; ros2 launch laser_uav_managers control_manager.launch.py
        # - export UAV_NAME=uav3; sleep 6; ros2 launch laser_uav_managers control_manager.launch.py
        # - export UAV_NAME=uav4; sleep 9; ros2 launch laser_uav_managers control_manager.launch.py
        # - 'history -s ros2 service call /$UAV_NAME/px4_api/arm std_srvs/srv/Trigger {}'
        # - 'history -s ros2 service call /$UAV_NAME/control_manager/takeoff std_srvs/srv/Trigger {}'
  - free_cmd:
      layout: tiled
      panes:
        - 'history -s ros2 topic pub -1 /$UAV_NAME/control_manager/goto laser_msgs/msg/PoseWithHeading \"{position: {x: 0.0, y: 0.0, z: 1.5}, heading: 0.0}\"'
  - trajectory_with_stop:
      layout: tiled
      panes:
        - 'history -s ros2 topic pub -1 /$UAV_NAME/control_manager/trajectory_path laser_msgs/msg/TrajectoryPath \"{stop_on_waypoints: false, speed: 7.0, waypoints: [
          {position: {x: 30.0, y: 0.0, z: 5.0}, heading: 0.0}
        ]}\"'
        - 'history -s ros2 topic pub -1 /$UAV_NAME/control_manager/trajectory_path laser_msgs/msg/TrajectoryPath \"{stop_on_waypoints: false, speed: 7.0, waypoints: [
          {position: {x: 0.0, y: 0.0, z: 5.0}, heading: 0.0}
        ]}\"'
