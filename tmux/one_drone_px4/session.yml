name: simulation
root: ./
startup_window: tui
pre_window: export UAV_NAME=uav1; export UAV_TYPE=x500
windows:
  - spawn:
      layout: even-horizontal
      panes:
        - ros2 launch laser_uav_simulation gazebo.launch.py real_time:=1.0
        - ros2 launch laser_uav_simulation spawn_drones.launch.py spawn_drones_file:=./configs/spawn.yaml
  - api:
      layout: even-horizontal
      panes:
        - sleep 1; ros2 launch laser_uav_hw_api px4_api.launch.py 
        - sleep 1; ros2 run laser_uav_simulation autostart.py 
  - estimation_manager:
      layout: tiled
      panes:
          - sleep 1; ros2 launch laser_uav_managers estimation_manager.launch.py
  - tui:
      layout: even-horizontal
      panes:
        - sleep 1; ros2 run laser_uav_tui tui --config ./configs/topics.yaml
  - control_manager:
      layout: tiled
      panes:
        - sleep 1; ros2 launch laser_uav_managers control_manager.launch.py
        - 'history -s ros2 service call /$UAV_NAME/hw_api/arm std_srvs/srv/Trigger {}'
        - 'history -s ros2 service call /$UAV_NAME/control_manager/takeoff std_srvs/srv/Trigger {}'
        - 'history -s ros2 service call /$UAV_NAME/control_manager/land std_srvs/srv/Trigger {}'
  - planning_manager:
      layout: tiled
      panes:
        - sleep 1; ros2 launch laser_uav_managers planning_manager.launch.py planning_manager_file:=./configs/planning_manager.yaml
  - free_cmd:
      layout: tiled
      panes:
        - 'history -s ros2 topic pub -1 /$UAV_NAME/planning_manager/goto laser_msgs/msg/PoseWithHeading \"{position: {x: 0.0, y: 0.0, z: 1.5}, heading: 0.0}\"'
  - trajectory_with_stop:
      layout: tiled
      panes:
        - 'history -s ros2 topic pub -1 /$UAV_NAME/planning_manager/trajectory_path laser_msgs/msg/TrajectoryPath \"{stop_on_waypoints: true, speed: 0.7, waypoints: [
          {position: {x: 0.0, y: 0.0, z: 1.5}, heading: 1.0},
          {position: {x: 2.0, y: 0.0, z: 1.5}, heading: 1.8},
          {position: {x: 2.0, y: 2.0, z: 1.5}, heading: 2.5},
          {position: {x: 0.0, y: 2.0, z: 1.5}, heading: 3.14},
          {position: {x: 0.0, y: 0.0, z: 1.5}, heading: 0.0},
        ]}\"'
